<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recetas gallegas</title>
  <!-- ?v= obliga al navegador a descargar la versión nueva tras cada cambio -->
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header>
    <h1>Buscador de recetas gallegas</h1>
    <form id="search-form">
      <div class="search-row">
        <input id="query" type="search" placeholder="Ej.: caldo gallego, empanada..." autofocus required>
        <button type="submit">Buscar</button>
      </div>
      <div class="filter-row">
        <select id="source" aria-label="Fuente">
          <option value="">Todas las fuentes</option>
          <option value="Kukinhas">Kukinhas</option>
          <option value="Receitario">Receitario</option>
        </select>
        <select id="categoria" aria-label="Categoría" class="llm-filter" hidden>
          <option value="">Todas las categorías</option>
          <option value="sobremesa">Sobremesa</option>
          <option value="repostaria">Repostaría</option>
          <option value="pan_e_empanadas">Pan e empanadas</option>
          <option value="sopas_e_caldos">Sopas e caldos</option>
          <option value="carne">Carne</option>
          <option value="peixe_e_marisco">Peixe e marisco</option>
          <option value="verduras_e_legumes">Verduras e legumes</option>
          <option value="ovos">Ovos</option>
          <option value="salsas_e_conservas">Salsas e conservas</option>
          <option value="bebidas">Bebidas</option>
          <option value="outros">Outros</option>
        </select>
        <select id="dificultade" aria-label="Dificultad">
          <option value="">Cualquier dificultad</option>
          <option value="facil">Fácil</option>
          <option value="media">Media</option>
          <option value="dificil">Difícil</option>
        </select>
      </div>
      <fieldset id="etiquetas" class="llm-filter" hidden>
        <legend>Etiquetas</legend>
        <label class="chip"><input type="checkbox" value="vexetariano"><span>Vexetariano</span></label>
        <label class="chip"><input type="checkbox" value="sen_gluten"><span>Sen glute</span></label>
        <label class="chip"><input type="checkbox" value="sen_lactose"><span>Sen lactosa</span></label>
        <label class="chip"><input type="checkbox" value="picante"><span>Picante</span></label>
        <label class="chip"><input type="checkbox" value="forno"><span>Ao forno</span></label>
        <label class="chip"><input type="checkbox" value="rapida"><span>Rápida</span></label>
      </fieldset>
    </form>
  </header>

  <main>
    <p id="status" role="status"></p>
    <aside id="dicas" hidden></aside>
    <ul id="results"></ul>
    <button id="more" type="button" hidden></button>
  </main>

  <script src="app.js?v=9"></script>
</body>
</html>
