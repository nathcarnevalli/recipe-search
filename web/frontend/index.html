<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recetas gallegas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Buscador de recetas gallegas</h1>
    <form id="search-form">
      <input id="query" type="search" placeholder="Ej.: caldo gallego, empanada..." autofocus required>
      <select id="source" aria-label="Fuente">
        <option value="">Todas las fuentes</option>
        <option value="Kukinhas">Kukinhas</option>
        <option value="Receitario">Receitario</option>
      </select>
      <select id="categoria" aria-label="Categoría">
        <option value="">Todas las categorías</option>
        <option value="sobremesa">Sobremesa</option>
        <option value="repostaria">Repostaría</option>
        <option value="pan_e_empanadas">Pan e empanadas</option>
        <option value="sopas_e_caldos">Sopas e caldos</option>
        <option value="carne">Carne</option>
        <option value="peixe_e_marisco">Peixe e marisco</option>
        <option value="verduras_e_legumes">Verduras e legumes</option>
        <option value="ovos">Ovos</option>
        <option value="salsas_e_conservas">Salsas e conservas</option>
        <option value="bebidas">Bebidas</option>
        <option value="outros">Outros</option>
      </select>
      <button type="submit">Buscar</button>
      <fieldset id="etiquetas">
        <legend>Etiquetas</legend>
        <label><input type="checkbox" value="vexetariano"> Vexetariano</label>
        <label><input type="checkbox" value="sen_gluten"> Sen glute</label>
        <label><input type="checkbox" value="sen_lactose"> Sen lactosa</label>
        <label><input type="checkbox" value="picante"> Picante</label>
        <label><input type="checkbox" value="forno"> Ao forno</label>
        <label><input type="checkbox" value="rapida"> Rápida</label>
      </fieldset>
      <p class="hint">Categoría e etiquetas xeradas automaticamente por un LLM a partir do título e os ingredientes; poden conter erros.</p>
    </form>
  </header>

  <main>
    <p id="status" role="status"></p>
    <ul id="results"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
